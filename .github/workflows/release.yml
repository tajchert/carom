# Builds, signs, and publishes a Carom release: the Android APK and the Mac app,
# with release notes taken from the version's section in CHANGELOG.md. The Hub
# ships as source at the same tag.
#
# Triggers:
#   - push of a v* tag: full release (build -> verify -> attach to release)
#   - workflow_dispatch: dry run. The APK and the Mac zip are only uploaded as
#     workflow artifacts, no release is created.
#
# Signing: the private keystore is decoded from the RELEASE_KEYSTORE_BASE64
# repo secret into the runner's temp dir and passed to Gradle via CAROM_* env
# vars. Secrets are never available to fork-triggered workflows; this workflow
# only runs on tag pushes and manual dispatches by repo writers. The Mac app is
# ad-hoc signed (no Developer ID yet) and not notarized.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: android

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: macos/App
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build universal ad-hoc signed app
        run: >-
          xcodebuild -project Carom.xcodeproj -scheme Carom -configuration Release
          -derivedDataPath "$RUNNER_TEMP/dd" -destination 'generic/platform=macOS'
          ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO
          DEVELOPMENT_TEAM= CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=-
          build | tail -n 20

      - name: Verify and zip
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="ci-${GITHUB_SHA::7}"
          fi
          APP="$RUNNER_TEMP/dd/Build/Products/Release/Carom.app"
          codesign --verify --deep --strict "$APP"
          lipo -archs "$APP/Contents/MacOS/Carom" | grep -q 'x86_64 arm64' \
            || { echo "Carom.app is not universal." >&2; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/mac-dist"
          cd "$GITHUB_WORKSPACE/mac-dist"
          ditto -c -k --sequesterRsrc --keepParent "$APP" "Carom-$VERSION-macos.zip"
          shasum -a 256 "Carom-$VERSION-macos.zip" > "Carom-$VERSION-macos.zip.sha256"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carom-macos
          path: mac-dist/*
          retention-days: 90

  release:
    needs: macos
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Check tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          ANDROID_VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          HUB_VERSION=$(node -p "require('../hub/package.json').version")
          MAC_VERSION=$(grep -m1 'MARKETING_VERSION:' ../macos/App/project.yml | awk '{print $2}')
          for pair in "android/app/build.gradle.kts:$ANDROID_VERSION" "hub/package.json:$HUB_VERSION" "macos/App/project.yml:$MAC_VERSION"; do
            if [ "${pair#*:}" != "$TAG_VERSION" ]; then
              echo "Tag $GITHUB_REF_NAME does not match version ${pair#*:} in ${pair%%:*}" >&2
              exit 1
            fi
          done

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 is not configured." >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed release APK
        env:
          CAROM_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          CAROM_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          CAROM_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          CAROM_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n1)
          "$APKSIGNER" verify --print-certs "$APK"
          "$APKSIGNER" verify --print-certs "$APK" \
            | grep -q "CN=Carom Release" \
            || { echo "APK is not release-signed with the Carom certificate." >&2; exit 1; }

      - name: Stage release artifacts
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="ci-${GITHUB_SHA::7}"
          fi
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/carom-android-$VERSION.apk"
          cp app/build/outputs/mapping/release/mapping.txt "dist/carom-android-$VERSION-mapping.txt"
          cd dist
          shasum -a 256 "carom-android-$VERSION.apk" > "carom-android-$VERSION.apk.sha256"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: carom-macos
          path: android/dist

      - name: Write release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ "${{ github.ref_type }}" = "tag" ] || VERSION=$(grep -m1 -o '^## \[[^]]*\]' ../CHANGELOG.md | tr -d '#[] ')
          # The version's CHANGELOG.md section, without its heading and link references.
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on && !/^\[[^]]+\]: / { print }
          ' ../CHANGELOG.md > dist/notes.md
          if ! grep -q '[^[:space:]]' dist/notes.md; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi
          cat >> dist/notes.md <<EOF

          ### Install

          - **📱 Android:** download \`carom-android-$VERSION.apk\` below and open it on your phone (allow "install unknown apps" for your browser or file manager). The \`.sha256\` file lets you check the download.
          - **☁️ Hub:** \`git clone --branch v$VERSION https://github.com/tajchert/carom.git && cd carom && npm install && node hub/bin/carom-hub.mjs deploy\`
          - **💻 Mac:** \`brew install --cask tajchert/tap/carom\`, or download \`Carom-$VERSION-macos.zip\` below (Apple Silicon and Intel, macOS 14+). The app is ad-hoc signed and not notarized: on first launch, open **System Settings → Privacy & Security** and choose **Open Anyway**. After an update, macOS may ask once to let Carom use its keychain items.

          The APK is signed with the Carom release certificate, SHA-256 \`da:44:b2:ef:ba:8c:c3:5e:e2:f6:e1:65:ca:36:19:d6:b6:fb:a1:b3:cd:20:a6:6d:a0:9f:d5:80:99:ca:e2:79\`.
          EOF
          cat dist/notes.md

      - name: Create or update GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; replacing assets and notes."
            gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/*.zip dist/*.sha256 --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file dist/notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "Carom ${GITHUB_REF_NAME#v}" \
              --notes-file dist/notes.md \
              dist/*.apk dist/*.zip dist/*.sha256
          fi

      - name: Upload mapping and dry-run artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: carom-release
          path: android/dist/*
          retention-days: 90
