name: Android

on:
  pull_request:
    paths:
      - 'android/**'
      - 'protocol/vectors/**'
      - '.github/workflows/android.yml'
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'protocol/vectors/**'
      - '.github/workflows/android.yml'

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Unit tests (incl. protocol vectors), lint, debug builds, and release R8 verification
        run: >-
          ./gradlew --no-daemon --stacktrace
          testDebugUnitTest lintDebug assembleDebug
          :core:security:assembleDebugAndroidTest
          :app:lintRelease :app:assembleRelease
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports
          path: 'android/**/build/reports/**'
          if-no-files-found: ignore
          retention-days: 7

  device-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools emulator platforms;android-37.0 build-tools;36.0.0 system-images;android-35;google_apis;x86_64'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run Keystore tests and the cold-start journey
        run: |
          sudo chmod a+rw /dev/kvm
          echo no | avdmanager create avd --force --name ci-phone --package 'system-images;android-35;google_apis;x86_64' --device pixel_6
          "$ANDROID_HOME/emulator/emulator" -avd ci-phone -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > /tmp/emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'kill "$EMULATOR_PID" || true' EXIT
          timeout 180 bash -c 'until adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r" | grep -q "^1$"; do sleep 2; done'
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          ./gradlew --no-daemon :core:security:connectedDebugAndroidTest
          ./gradlew --no-daemon :benchmark:connectedNonMinifiedReleaseAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.mtajchert.carom.app.benchmark.StartupSmokeTest
      - name: Upload device reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: device-reports
          path: |
            android/**/build/reports/androidTests/**
            android/**/build/outputs/androidTest-results/**
            /tmp/emulator.log
          if-no-files-found: ignore
          retention-days: 7

  screenshots:
    # Keep rendering on macOS to match the reviewed reference font environment.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      TZ: UTC
      LANG: en_US.UTF-8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Validate reviewed screenshots
        run: >-
          ./gradlew --no-daemon
          :core:designsystem:validateDebugScreenshotTest
          :core:ui:validateDebugScreenshotTest
          :feature:home:impl:validateDebugScreenshotTest
          :feature:onboarding:impl:validateDebugScreenshotTest
          :feature:pairing:impl:validateDebugScreenshotTest
          :feature:devices:impl:validateDebugScreenshotTest
          :feature:settings:impl:validateDebugScreenshotTest
          :feature:notifications:impl:validateDebugScreenshotTest
          :feature:clipboard:impl:validateDebugScreenshotTest
      - name: Upload screenshot comparisons
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshot-reports
          path: |
            android/**/build/reports/screenshotTest/**
            android/**/build/outputs/screenshotTest*/**
          if-no-files-found: ignore
          retention-days: 7
