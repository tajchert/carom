# Robolectric ships shadows for a platform only after that platform is released,
# so it trails compileSdk/targetSdk. Pinning the test SDK here keeps unit tests
# running when the app targets a newer platform than Robolectric supports.
#
# Raise this to match targetSdk as soon as Robolectric supports it, and treat a
# large gap as a signal that these tests are validating an older platform than
# the one the app ships against.
sdk=36
